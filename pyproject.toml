[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-ace-muon-lora"
version = "0.1.0"
description = "Matrix-aware Muon optimization for LoRA-tuned tutoring outcome classification"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "xiaosa"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "peft>=0.15,<1",
  "scikit-learn>=1.4,<2",
  "transformers>=4.51,<5",
]

[project.optional-dependencies]
train = ["ms-swift==4.4.2", "torch>=2.6"]
xgb = ["xgboost>=2.1,<4"]
test = ["pytest>=8"]

[project.scripts]
trace-ace-prepare = "trace_ace.data:main"
trace-ace-train = "trace_ace.train:main"
trace-ace-evaluate = "trace_ace.evaluate:main"
trace-ace-predict = "trace_ace.predict:main"
trace-ace-xgb = "trace_ace.xgb_head:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
